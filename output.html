<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VNV Pro — AI Output</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%237c3aed'/><text x='16' y='23' font-size='18' text-anchor='middle' fill='%23fff' font-family='Arial' font-weight='bold'>V</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    /* The AI frames are drawn onto this canvas. A canvas is composited into the
       page like normal pixels, so OBS Window Capture grabs it reliably — a raw
       <video> playing a WebRTC stream renders on a GPU overlay that OBS (BitBlt)
       captures as BLACK. The source <video> is hidden and only feeds frames. */
    #cv  { width: 100vw; height: 100vh; object-fit: contain; background: #000; display: block; cursor: pointer; }
    #out { position: absolute; width: 2px; height: 2px; opacity: 0; pointer-events: none; left: -9999px; }
    #hint {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.85); font-family: system-ui, sans-serif; font-size: 14px;
      background: rgba(0,0,0,0.6); padding: 10px 18px; border-radius: 999px;
      transition: opacity 0.4s; pointer-events: none;
    }
    #tapfs {
      position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.55); color: #fff; font-family: system-ui, sans-serif;
      font-size: 20px; cursor: pointer; flex-direction: column; gap: 10px; text-align: center;
    }
    #tapfs .big { font-size: 26px; font-weight: 700; }
    #tapfs.hidden { display: none; }
    #waiting {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.6); font-family: system-ui, sans-serif; font-size: 16px;
    }
  </style>
</head>
<body>
  <canvas id="cv"></canvas>
  <video id="out" autoplay playsinline muted></video>
  <div id="waiting">Waiting for AI output… keep the main tab open.</div>
  <div id="tapfs"><div class="big">⛶ Tap / Click to go Full Screen</div><div>Press Esc to exit full screen</div></div>
  <div id="hint" style="opacity:0;">Click anywhere for full screen · Press Esc to exit</div>

  <script>
    const video   = document.getElementById('out');
    const cv      = document.getElementById('cv');
    const ctx     = cv.getContext('2d', { alpha: false });
    const waiting = document.getElementById('waiting');
    const hint    = document.getElementById('hint');
    const tapfs   = document.getElementById('tapfs');

    let drawing = false;

    function drawFrame() {
      // keep the canvas buffer at the stream's real resolution for a crisp, 1:1 feed
      if (video.videoWidth && (cv.width !== video.videoWidth || cv.height !== video.videoHeight)) {
        cv.width = video.videoWidth; cv.height = video.videoHeight;
      }
      if (video.readyState >= 2 && video.videoWidth) {
        try { ctx.drawImage(video, 0, 0, cv.width, cv.height); } catch (_) {}
      }
    }
    function startDrawing() {
      if (drawing) return;
      drawing = true;
      if ('requestVideoFrameCallback' in HTMLVideoElement.prototype) {
        const cb = () => { drawFrame(); if (drawing) video.requestVideoFrameCallback(cb); };
        video.requestVideoFrameCallback(cb);
      } else {
        const loop = () => { drawFrame(); if (drawing) requestAnimationFrame(loop); };
        requestAnimationFrame(loop);
      }
    }

    function attach(stream) {
      if (!stream) return false;
      video.srcObject = stream;
      video.play().catch(() => {});
      waiting.style.display = 'none';
      startDrawing();
      return true;
    }

    // Try to grab the stream from the main tab that opened this window
    function tryGrab() {
      try {
        if (window.opener && window.opener.aiOutputStream) {
          return attach(window.opener.aiOutputStream);
        }
      } catch (_) {}
      return false;
    }

    if (!tryGrab()) {
      const iv = setInterval(() => { if (tryGrab()) clearInterval(iv); }, 500);
    }

    // Click anywhere to toggle true OS full screen
    function toggleFs() {
      if (!document.fullscreenElement) {
        (document.documentElement.requestFullscreen?.() || Promise.resolve()).catch(() => {});
      } else {
        document.exitFullscreen?.();
      }
    }
    document.body.addEventListener('click', toggleFs);

    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) {
        tapfs.classList.add('hidden');
        hint.style.opacity = '1';
        setTimeout(() => { hint.style.opacity = '0'; }, 3000);
      } else {
        tapfs.classList.remove('hidden');
      }
    });

    // If the main tab closes the stream, stop drawing and show waiting again
    setInterval(() => {
      try {
        if (!window.opener || window.opener.closed || !window.opener.aiOutputStream) {
          if (video.srcObject) {
            drawing = false;
            video.srcObject = null;
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
            waiting.style.display = 'flex';
          }
        }
      } catch (_) {}
    }, 1500);
  </script>
</body>
</html>
